kind = "mobile"
previewPath = "/"
title = "Passenger App"
version = "1.0.0"
id = "artifacts/passenger-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21859

[services.development]
run = "pnpm --filter @workspace/passenger-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/passenger-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/passenger-app", "run", "serve" ]

[services.env]
PORT = "21859"
BASE_PATH = "/"
